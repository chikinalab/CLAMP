on:
  push:
    branches: [main, devel]
  pull_request:

name: BiocCheck.yaml

permissions: read-all

jobs:
  BiocCheck:
    runs-on: ubuntu-latest
    name: BiocCheck

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          http-user-agent: release
          use-public-rspm: true

      - name: Install Deps
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          # Remove pivlab/CLAMPData once CLAMPData is on Bioconductor;
          # it will then be picked up automatically from DESCRIPTION.
          extra-packages: |
            bioc::BiocCheck
            pivlab/CLAMPData

      - name: Build tarball
        run: R CMD build --no-manual .

      - name: Run BiocCheck
        run: |
          tarball <- list.files(pattern = "^CLAMP_.*\\.tar\\.gz$")[1]
          BiocCheck::BiocCheck(tarball, `quit-with-status` = TRUE)
        shell: Rscript {0}
